{%- include colophon.html -%}

<script>
(function(){
  const el = document.getElementById("clock");
  if(!el) return;
  function tick(){
    const d = new Date();
    const f = n => String(n).padStart(2,"0");
    el.textContent = f(d.getUTCHours())+":"+f(d.getUTCMinutes())+":"+f(d.getUTCSeconds())+" UTC";
  }
  tick(); setInterval(tick, 1000);
})();
</script>

</body>
</html>
