document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<title>WP-DRAFT-01 · Workpads — Portable, sovereign, URL-transmissible commercial records<\u002Ftitle>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"83bb0e56-c72f-474d-8e33-2d227261c840\"><\u002Fscript>\n<style>\n  :root {\n    --paper: #f6f1e7;\n    --paper-2: #efe7d6;\n    --ink: #1a1614;\n    --ink-2: #2c2520;\n    --muted: #5b524a;\n    --muted-2: #8a7a6a;\n    --rule: #d8ccb3;\n    --accent: #b07830;\n    --accent-2: #8a5a18;\n    --tag-bg: #e8ddc4;\n    --ok: #4a7a3a;\n    --serif: Georgia, \"Iowan Old Style\", \"Source Serif Pro\", \"Palatino Linotype\", serif;\n    --mono: ui-monospace, \"SF Mono\", \"JetBrains Mono\", Menlo, Consolas, monospace;\n    --sans: -apple-system, BlinkMacSystemFont, \"Helvetica Neue\", Arial, sans-serif;\n  }\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  body {\n    background: var(--paper);\n    color: var(--ink);\n    font-family: var(--serif);\n    font-size: 17px;\n    line-height: 1.65;\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n  }\n\n  /* Top banner — the \"draft\" stamp */\n  .draftbar {\n    background: var(--ink);\n    color: var(--paper);\n    font-family: var(--mono);\n    font-size: 12px;\n    letter-spacing: 0.18em;\n    padding: 14px 0;\n  }\n  .draftbar .wrap {\n    max-width: 960px;\n    margin: 0 auto;\n    padding: 0 40px;\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    gap: 24px;\n    flex-wrap: wrap;\n  }\n  .draftbar .right { color: var(--muted-2); }\n\n  .page {\n    max-width: 960px;\n    margin: 0 auto;\n    padding: 64px 40px 96px;\n  }\n\n  /* Hero */\n  .hero { padding: 24px 0 24px; }\n  .hero .eyebrow {\n    font-family: var(--mono);\n    font-size: 12px;\n    letter-spacing: 0.22em;\n    color: var(--accent-2);\n    text-transform: uppercase;\n    margin-bottom: 20px;\n  }\n  .hero h1 {\n    font-family: var(--serif);\n    font-weight: 700;\n    font-size: 84px;\n    line-height: 0.95;\n    letter-spacing: -0.02em;\n    margin: 0 0 22px;\n  }\n  .hero .deck {\n    font-family: var(--serif);\n    font-style: italic;\n    font-size: 28px;\n    line-height: 1.3;\n    color: var(--muted);\n    max-width: 720px;\n    text-wrap: pretty;\n  }\n  .hero .lede {\n    margin-top: 28px;\n    max-width: 720px;\n    font-size: 18px;\n    color: var(--ink-2);\n    text-wrap: pretty;\n  }\n  .hairline {\n    height: 0;\n    border: 0;\n    border-top: 2px solid var(--accent);\n    margin: 56px 0 40px;\n    max-width: 100%;\n  }\n  .hairline.thin { border-top: 1px solid var(--rule); margin: 32px 0; }\n\n  /* Metadata strip */\n  .meta {\n    font-family: var(--mono);\n    font-size: 12px;\n    letter-spacing: 0.04em;\n    color: var(--muted);\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    gap: 20px;\n    border-top: 1px solid var(--rule);\n    border-bottom: 1px solid var(--rule);\n    padding: 18px 0;\n    margin-top: 36px;\n  }\n  .meta .k { color: var(--muted-2); text-transform: uppercase; letter-spacing: 0.18em; font-size: 10px; display: block; margin-bottom: 4px; }\n  .meta .v { color: var(--ink); }\n\n  /* TOC */\n  .toc {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 4px 48px;\n    margin: 8px 0 16px;\n    font-family: var(--mono);\n    font-size: 14px;\n  }\n  .toc a {\n    display: flex;\n    align-items: baseline;\n    color: var(--ink);\n    text-decoration: none;\n    padding: 7px 0;\n    border-bottom: 1px dotted transparent;\n    gap: 14px;\n  }\n  .toc a:hover { color: var(--accent-2); border-bottom-color: var(--rule); }\n  .toc a .num { color: var(--muted-2); min-width: 36px; }\n  .toc a .label { flex: 1; }\n  .toc a .pg { color: var(--muted-2); font-variant-numeric: tabular-nums; }\n\n  /* Section heads */\n  section { margin: 72px 0; scroll-margin-top: 24px; }\n  .sechead {\n    display: grid;\n    grid-template-columns: 96px 1fr;\n    align-items: baseline;\n    gap: 24px;\n    margin-bottom: 28px;\n    padding-bottom: 18px;\n    border-bottom: 1px solid var(--rule);\n  }\n  .sechead .num {\n    font-family: var(--mono);\n    font-size: 13px;\n    color: var(--accent-2);\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    padding-top: 12px;\n  }\n  .sechead h2 {\n    font-family: var(--serif);\n    font-weight: 700;\n    font-size: 42px;\n    line-height: 1.1;\n    letter-spacing: -0.01em;\n    margin: 0 0 6px;\n  }\n  .sechead .sub {\n    font-family: var(--mono);\n    font-size: 12px;\n    color: var(--muted);\n    letter-spacing: 0.06em;\n  }\n\n  .body { display: grid; grid-template-columns: 96px 1fr; gap: 24px; }\n  .body p, .body ul, .body ol, .body table, .body .code, .body .callout, .body .subhead, .body h3, .body h4, .body .grid2, .body .grid3, .body .pull, .body figure, .body .arrows {\n    grid-column: 2;\n  }\n  .body p { margin: 0 0 16px; text-wrap: pretty; max-width: 68ch; }\n  .body p.wide { max-width: 100%; }\n\n  /* Side label */\n  .sidelabel {\n    grid-column: 1;\n    font-family: var(--mono);\n    font-size: 10px;\n    letter-spacing: 0.18em;\n    color: var(--muted-2);\n    text-transform: uppercase;\n    text-align: right;\n    padding-top: 6px;\n  }\n\n  h3 {\n    font-family: var(--serif);\n    font-weight: 700;\n    font-size: 24px;\n    margin: 36px 0 12px;\n    letter-spacing: -0.005em;\n  }\n  h4 {\n    font-family: var(--mono);\n    font-size: 12px;\n    text-transform: uppercase;\n    letter-spacing: 0.14em;\n    color: var(--accent-2);\n    margin: 28px 0 10px;\n  }\n  .subhead {\n    font-family: var(--mono);\n    font-size: 11px;\n    text-transform: uppercase;\n    letter-spacing: 0.18em;\n    color: var(--muted-2);\n    margin: 22px 0 8px;\n  }\n\n  /* Lists */\n  ul, ol { padding-left: 22px; margin: 0 0 16px; }\n  li { margin-bottom: 6px; max-width: 64ch; }\n  li::marker { color: var(--accent); }\n\n  /* Code */\n  .code {\n    font-family: var(--mono);\n    font-size: 13px;\n    line-height: 1.55;\n    background: var(--ink);\n    color: #f4e8c8;\n    padding: 18px 22px;\n    border-radius: 2px;\n    overflow-x: auto;\n    margin: 8px 0 20px;\n    white-space: pre;\n    border-left: 3px solid var(--accent);\n  }\n  .code .c { color: #8a7a6a; }\n  .code .k { color: #e6a45a; }\n  .code .s { color: #c8d9a8; }\n  .code .n { color: #d8c08a; }\n  code.inl {\n    font-family: var(--mono);\n    font-size: 0.88em;\n    background: var(--tag-bg);\n    padding: 1px 6px;\n    border-radius: 2px;\n    color: var(--ink);\n  }\n\n  /* Tables */\n  table {\n    border-collapse: collapse;\n    width: 100%;\n    font-size: 14px;\n    margin: 8px 0 22px;\n    background: var(--paper);\n  }\n  thead th {\n    text-align: left;\n    font-family: var(--mono);\n    font-size: 11px;\n    letter-spacing: 0.12em;\n    text-transform: uppercase;\n    color: var(--muted);\n    padding: 10px 14px;\n    border-bottom: 2px solid var(--ink);\n    font-weight: 500;\n  }\n  tbody td {\n    padding: 10px 14px;\n    border-bottom: 1px solid var(--rule);\n    vertical-align: top;\n    font-family: var(--serif);\n  }\n  tbody td.mono, tbody td:first-child.k { font-family: var(--mono); font-size: 12.5px; color: var(--ink); }\n  tbody tr:nth-child(even) td { background: rgba(216, 204, 179, 0.16); }\n\n  /* Callout */\n  .callout {\n    border-left: 3px solid var(--accent);\n    padding: 14px 18px;\n    background: rgba(176, 120, 48, 0.06);\n    margin: 16px 0 22px;\n    font-style: italic;\n    color: var(--ink-2);\n  }\n  .callout strong { font-style: normal; font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent-2); display: block; margin-bottom: 4px; }\n\n  /* Drop cap */\n  .dropcap::first-letter {\n    font-family: var(--serif);\n    font-weight: 700;\n    font-size: 5.6em;\n    float: left;\n    line-height: 0.85;\n    margin: 6px 10px 0 0;\n    color: var(--ink);\n  }\n\n  /* Two-col layout block */\n  .grid2 {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 32px;\n    margin: 12px 0 24px;\n  }\n  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin: 12px 0 24px; }\n  .grid2 .card, .grid3 .card {\n    background: var(--paper-2);\n    padding: 18px 20px;\n    border-top: 2px solid var(--accent);\n  }\n  .grid2 .card h4, .grid3 .card h4 { margin-top: 0; }\n  .grid2 .card p, .grid3 .card p { margin-bottom: 0; font-size: 15px; }\n\n  /* Pull quote */\n  .pull {\n    font-family: var(--serif);\n    font-style: italic;\n    font-size: 26px;\n    line-height: 1.3;\n    color: var(--ink);\n    border-left: 0;\n    margin: 32px 0;\n    padding: 6px 0 6px 24px;\n    border-left: 3px solid var(--accent);\n    max-width: 720px;\n    text-wrap: pretty;\n  }\n\n  /* ASCII art / arrows diagrams */\n  .arrows {\n    font-family: var(--mono);\n    font-size: 12.5px;\n    line-height: 1.5;\n    background: var(--paper-2);\n    padding: 18px 22px;\n    border-left: 3px solid var(--accent);\n    color: var(--ink);\n    white-space: pre;\n    overflow-x: auto;\n    margin: 10px 0 22px;\n  }\n\n  /* Hash demo */\n  .urldemo {\n    font-family: var(--mono);\n    font-size: 13px;\n    background: var(--ink);\n    color: var(--paper);\n    padding: 14px 18px;\n    overflow-x: auto;\n    word-break: break-all;\n    border-radius: 2px;\n    margin: 8px 0 18px;\n  }\n  .urldemo .o { color: #8a7a6a; }\n  .urldemo .p { color: #e6a45a; }\n  .urldemo .tag { color: #c8d9a8; }\n  .urldemo .payload { color: #f4e8c8; }\n  .urldemo .ch { color: #d8c08a; }\n\n  /* Footer */\n  footer {\n    border-top: 2px solid var(--ink);\n    margin-top: 80px;\n    padding: 24px 40px 60px;\n    background: var(--paper);\n  }\n  footer .wrap {\n    max-width: 960px;\n    margin: 0 auto;\n    font-family: var(--mono);\n    font-size: 12px;\n    letter-spacing: 0.06em;\n    color: var(--muted);\n    display: gr cer that mimics RFC page-break */\n  .pagebreak {\n    text-align: center;\n    font-family: var(--mono);\n    font-size: 10px;\n    color: var(--muted-2);\n    letter-spacing: 0.3em;\n    padding: 60px 0 20px;\n  }\n\n  /* Live now strip */\n  .livenow {\n    margin: 40px 0 16px;\n    border: 1px solid var(--ink);\n    background: var(--paper-2);\n    padding: 0;\n    display: grid;\n    grid-template-columns: 1fr 1.2fr;\n    gap: 0;\n  }\n  .livenow .lcopy { padding: 32px 36px; border-right: 1px solid var(--ink); }\n  .livenow .lvis { padding: 32px 36px; background: var(--ink); color: var(--paper); }\n  .livenow .ltag {\n    font-family: var(--mono);\n    font-size: 10px;\n    letter-spacing: 0.24em;\n    text-transform: uppercase;\n    color: var(--accent-2);\n    margin-bottom: 14px;\n    display: flex;\n    align-items: center;\n    gap: 10px;\n  }\n  .livenow .lvis .ltag { color: #e6a45a; }\n  .livenow .ldot {\n    width: 9px; height: 9px; border-radius: 50%;\n    background: var(--accent);\n    animation: livePulse 2s ease-in-out infinite;\n  }\n  @keyframes livePulse {\n    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(176, 120, 48, 0.55); }\n    50% { opacity: 0.55; box-shadow: 0 0 0 8px rgba(176, 120, 48, 0); }\n  }\n  .livenow h3 {\n    font-family: var(--serif);\n    font-size: 26px;\n    margin: 0 0 10px;\n    line-height: 1.2;\n    letter-spacing: -0.005em;\n  }\n  .livenow .lvis h3 { color: var(--paper); }\n  .livenow p { margin: 0 0 12px; font-size: 15px; line-height: 1.55; color: var(--ink-2); text-wrap: pretty; }\n  .livenow .lvis p { color: #d6c4a4; }\n  .livenow a.lurl {\n    font-family: var(--mono);\n    font-size: 14px;\n    color: var(--paper);\n    text-decoration: none;\n    border-bottom: 1px solid #8a5a18;\n    padding-bottom: 1px;\n  }\n  .livenow a.lurl:hover { color: #f4e8c8; border-bottom-color: #e6a45a; }\n  .livenow .lmeta {\n    font-family: var(--mono);\n    font-size: 11px;\n    color: var(--muted-2);\n    letter-spacing: 0.06em;\n    margin-top: 14px;\n  }\n  .livenow .lvis .lmeta { color: #8a7a6a; }\n\n  /* Image slot placeholders */\n  .figgrid {\n    display: grid;\n    gap: 20px;\n    margin: 16px 0 8px;\n  }\n  .figgrid.web {\n    grid-template-columns: 1fr;\n  }\n  .figgrid.phones {\n    grid-template-columns: repeat(3, 1fr);\n  }\n  .figslot {\n    background: var(--paper-2);\n    border: 1px solid var(--rule);\n    padding: 0;\n    position: relative;\n    overflow: hidden;\n  }\n  .figslot.browser { aspect-ratio: 16 / 10; }\n  .figslot.phone { aspect-ratio: 9 / 16; max-width: 280px; margin: 0 auto; }\n  .figslot image-slot { width: 100%; height: 100%; display: block; }\n  .figcap {\n    font-family: var(--mono);\n    font-size: 11px;\n    letter-spacing: 0.08em;\n    color: var(--muted);\n    text-transform: uppercase;\n    margin-top: 8px;\n    text-align: center;\n  }\n  .figcap .seq { color: var(--muted-2); margin-right: 8px; }\n\n  /* Browser chrome frame around web screenshots */\n  .browserframe {\n    border: 1px solid var(--ink);\n    background: var(--paper-2);\n    padding: 0;\n    overflow: hidden;\n  }\n  .browserframe .bbar {\n    background: #d8ccb3;\n    padding: 9px 12px;\n    display: flex;\n    align-items: center;\n    gap: 8px;\n    border-bottom: 1px solid #b9ab92;\n  }\n  .browserframe .bdot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink); opacity: 0.4; }\n  .browserframe .bdot:nth-child(1) { background: #c97a5c; opacity: 0.85; }\n  .browserframe .bdot:nth-child(2) { background: #c9a35c; opacity: 0.85; }\n  .browserframe .bdot:nth-child(3) { background: #7a9a5a; opacity: 0.85; }\n  .browserframe .burl {\n    font-family: var(--mono);\n    font-size: 11px;\n    background: var(--paper);\n    border: 1px solid #b9ab92;\n    border-radius: 3px;\n    padding: 3px 10px;\n    margin-left: 14px;\n    color: var(--ink-2);\n    flex: 1;\n    max-width: 360px;\n  }\n  .browserframe .bbody { aspect-ratio: 16 / 9; }\n\n  /* Phone (feature phone)
