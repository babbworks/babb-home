\n\n\n\n\n<div class=\"draftbar\">\n  <div class=\"wrap\">\n    <span>WP-DRAFT-01 · WORKPADS PROJECT · v0.1<\u002Fspan>\n    <span class=\"right\">BABB · 2026-05-13 · OPEN STANDARD<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"page\">\n\n  <header class=\"hero\">\n    <div class=\"eyebrow\">§ Workpads Standard — Normative Specification<\u002Fdiv>\n    <h1>Workpads.<\u002Fh1>\n    <p class=\"deck\">A record format and protocol for portable, sovereign, URL-transmissible commercial records — no server, no account, no file.<\u002Fp>\n    <p class=\"lede\">A workpad documents a piece of work — a job, a quote, an invoice, an expense, a completion — in a compact binary encoding that travels as a URL hash fragment over SMS, WhatsApp, QR code, or any link transport. The atomic unit is the workpad record: complete enough to stand alone, compact enough to travel as a URL, honest about its state, sovereign to its creator, and able to reference other records through a chain protocol.<\u002Fp>\n\n    <div class=\"meta\">\n      <div><span class=\"k\">Version<\u002Fspan><span class=\"v\">v0.1 — 2026-04-27<\u002Fspan><\u002Fdiv>\n      <div><span class=\"k\">Maintainer<\u002Fspan><span class=\"v\">Babb Ltd.<\u002Fspan><\u002Fdiv>\n      <div><span class=\"k\">Conformance<\u002Fspan><span class=\"v\">BASICS Core v0.1.1<\u002Fspan><\u002Fdiv>\n      <div><span class=\"k\">Status<\u002Fspan><span class=\"v\">Live / Implementation<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- LIVE NOW -->\n  <aside class=\"livenow\" aria-label=\"Live status\">\n    <div class=\"lcopy\">\n      <div class=\"ltag\"><span class=\"ldot\"><\u002Fspan> Live now · Parallel implementations<\u002Fdiv>\n      <h3>workpads.me is live, and shipping alongside Workpads for KaiOS.<\u002Fh3>\n      <p><strong>workpads.me<\u002Fstrong> is the canonical web entry point — three-column app, hash-routed wizard, and a standalone receiver page at <code class=\"inl\">/p<\u002Fcode> that decodes any incoming share URL with no install required. It is in active development and ships from the <code class=\"inl\">workpadsdotme<\u002Fcode> repository.<\u002Fp>\n      <p><strong>Workpads for KaiOS<\u002Fstrong> is the feature-phone reference app, developed in parallel from the same service layer and the same inline copy of <code class=\"inl\">@workpads/codec<\u002Fcode>. It targets 240×320 D-pad devices running KaiOS 3.x, with a KaiOS 2.5 build coming in v0.2.<\u002Fp>\n      <p>A URL encoded on a £20 KaiOS handset decodes correctly in a desktop browser, and back — that round-trip is the load-bearing interoperability test of the entire standard.<\u002Fp>\n      <div class=\"lmeta\">workpadsdotme · workpadskaios · same codec · same record · two runtimes<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"lvis\">\n      <div class=\"ltag\"><span class=\"ldot\"><\u002Fspan> workpads.me<\u002Fdiv>\n      <h3 style=\"font-family: var(--mono); font-size: 17px; letter-spacing: 0.04em; line-height: 1.4; margin-bottom: 14px;\">Try the receiver<\u002Fh3>\n      <p style=\"font-family: var(--mono); font-size: 12px; line-height: 1.6;\">Send yourself a record from the app, then open the URL on any browser. The hash never touches the server. The page decodes locally and renders the record from a cached template.<\u002Fp>\n      <a class=\"lurl\" href=\"https://workpads.me\" target=\"_blank\" rel=\"noopener\">→ workpads.me<\u002Fa>\n      <div class=\"lmeta\">Static · CDN-cacheable · no account · no database<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <hr class=\"hairline\">\n\n  <nav>\n    <div class=\"subhead\" style=\"margin: 4px 0 14px;\">Table of Contents<\u002Fdiv>\n    <div class=\"toc\">\n      <a href=\"#s1\"><span class=\"num\">§ 1.<\u002Fspan><span class=\"label\">Overview<\u002Fspan><span class=\"pg\">01<\u002Fspan><\u002Fa>\n      <a href=\"#s2\"><span class=\"num\">§ 2.<\u002Fspan><span class=\"label\">PADS Data Model<\u002Fspan><span class=\"pg\">02<\u002Fspan><\u002Fa>\n      <a href=\"#s3\"><span class=\"num\">§ 3.<\u002Fspan><span class=\"label\">URL-as-Document<\u002Fspan><span class=\"pg\">03<\u002Fspan><\u002Fa>\n      <a href=\"#s4\"><span class=\"num\">§ 4.<\u002Fspan><span class=\"label\">Template System<\u002Fspan><span class=\"pg\">04<\u002Fspan><\u002Fa>\n      <a href=\"#s5\"><span class=\"num\">§ 5.<\u002Fspan><span class=\"label\">Codec &amp; Compact Encoding<\u002Fspan><span class=\"pg\">05<\u002Fspan><\u002Fa>\n      <a href=\"#s6\"><span class=\"num\">§ 6.<\u002Fspan><span class=\"label\">Record Schema (svc-basic)<\u002Fspan><span class=\"pg\">06<\u002Fspan><\u002Fa>\n      <a href=\"#s7\"><span class=\"num\">§ 7.<\u002Fspan><span class=\"label\">Naming Convention<\u002Fspan><span class=\"pg\">07<\u002Fspan><\u002Fa>\n      <a href=\"#s8\"><span class=\"num\">§ 8.<\u002Fspan><span class=\"label\">RecordService Interface<\u002Fspan><span class=\"pg\">08<\u002Fspan><\u002Fa>\n      <a href=\"#s9\"><span class=\"num\">§ 9.<\u002Fspan><span class=\"label\">Storage Adapter Contract<\u002Fspan><span class=\"pg\">09<\u002Fspan><\u002Fa>\n      <a href=\"#s10\"><span class=\"num\">§ 10.<\u002Fspan><span class=\"label\">Two-Build Strategy<\u002Fspan><span class=\"pg\">10<\u002Fspan><\u002Fa>\n      <a href=\"#s11\"><span class=\"num\">§ 11.<\u002Fspan><span class=\"label\">Chain Protocol<\u002Fspan><span class=\"pg\">11<\u002Fspan><\u002Fa>\n      <a href=\"#s12\"><span class=\"num\">§ 12.<\u002Fspan><span class=\"label\">BASICS Conformance<\u002Fspan><span class=\"pg\">12<\u002Fspan><\u002Fa>\n      <a href=\"#s13\"><span class=\"num\">§ 13.<\u002Fspan><span class=\"label\">The Ecosystem<\u002Fspan><span class=\"pg\">13<\u002Fspan><\u002Fa>\n      <a href=\"#s14\"><span class=\"num\">§ 14.<\u002Fspan><span class=\"label\">Reference Apps<\u002Fspan><span class=\"pg\">14<\u002Fspan><\u002Fa>\n      <a href=\"#s15\"><span class=\"num\">§ 15.<\u002Fspan><span class=\"label\">Conformance &amp; Use<\u002Fspan><span class=\"pg\">15<\u002Fspan><\u002Fa>\n      <a href=\"#s16\"><span class=\"num\">§ 16.<\u002Fspan><span class=\"label\">Versioning &amp; v0.2 Roadmap<\u002Fspan><span class=\"pg\">16<\u002Fspan><\u002Fa>\n      <a href=\"#s17\"><span class=\"num\">§ 17.<\u002Fspan><span class=\"label\">workpads.me<\u002Fspan><span class=\"pg\">17<\u002Fspan><\u002Fa>\n      <a href=\"#s18\"><span class=\"num\">§ 18.<\u002Fspan><span class=\"label\">Open Door, Not Territory<\u002Fspan><span class=\"pg\">18<\u002Fspan><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <!-- §1 OVERVIEW -->\n  <section id=\"s1\">\n    <div class=\"sechead\">\n      <div class=\"num\">§ 1<\u002Fdiv>\n      <div>\n        <h2>Overview<\u002Fh2>\n        <div class=\"sub\">What Workpads is, why it exists, what it replaces.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"body\">\n      <div class=\"sidelabel\">1.1 — Premise<\u002Fdiv>\n      <p class=\"dropcap\">A workpad is a piece of work, written down. It documents who did what, when, where, for whom, and what happened — and it does so in a form small enough to fit inside a URL. There is no document object to upload, no file to host, no account to maintain. A workpad is a string of characters that any compatible reader can render into a complete record.<\u002Fp>\n      <p>The Workpads Standard defines five things: a data model (PADS), a record schema (<code class=\"inl\">svc-basic<\u002Fcode>), a binary frame format with a compact URL encoding (pads-v1), a template system for separating content from presentation, and a service surface for storing, encoding, and exchanging records on-device. Together they describe a system in which structured commercial documents travel through SMS, QR codes, WhatsApp messages, and clipboards with the same fidelity as they travel through email attachments — but without the file.<\u002Fp>\n\n      <div class=\"callout\">\n        <strong>The atomic unit<\u002Fstrong>\n        A workpad record is complete enough to stand alone, compact enough to travel as a URL, honest about its state, sovereign to its creator, and able to reference other records through a chain protocol.\n      <\u002Fdiv>\n\n      <div class=\"sidelabel\">1.2 — Five properties<\u002Fdiv>\n      <h3>The five properties of a workpad record<\u002Fh3>\n      <ol>\n        <li><strong>Complete.<\u002Fstrong> A record carries everything required to render itself — the data, a pointer to its presentation, the codec version that produced it. A recipient with no prior context can open and read it.<\u002Fli>\n        <li><strong>Compact.<\u002Fstrong> The encoded form fits inside an SMS, a QR code, or a clipboard. Full records typically round-trip at 180–300 characters of base64url.<\u002Fli>\n        <li><strong>Honest.<\u002Fstrong> Absent fields are absent, not null. Empty strings are not lies about state. Decoders should reject corruption rather than partially render.<\u002Fli>\n        <li><strong>Sovereign.<\u002Fstrong> The creator owns the record. It is stored on their device first. Sharing produces a copy under the recipient's control, never a pointer back to the sender's infrastructure.<\u002Fli>\n        <li><strong>Linkable.<\u002Fstrong> Records reference other records by chain reference, not by foreign key in a shared database. A quote and its approval are two sovereign records linked by a 4-character chain ref.<\u002Fli>\n      <\u002Fol>\n\n      <div class=\"sidelabel\">1.3 — What this is not<\u002Fdiv>\n      <h3>What this is not<\u002Fh3>\n      <p>It is not a replacement for databases. URL strings carry a snapshot of data at the time of encoding — they do not live-update. It is not a replacement for authenticated portals — URL fragments are not secret, and anyone with the URL can view the document. And it is not dependent on Babb. The Standard is public, the orchestrator pattern can be implemented by anyone, and the registry service is one implementation, not the only one.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- §2 PADS -->\n  <section id=\"s2\">\n    <div class=\"sechead\">\n      <div class=\"num\">§ 2<\u002Fdiv>\n      <div>\n        <h2>The PADS data model.<\u002Fh2>\n        <div class=\"sub\">Process · Actions · Details · Story — four sections, one flat record.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"body\">\n      <div class=\"sidelabel\">2.1 — Structure<\u002Fdiv>\n      <p>PADS divides the information required for a field-work job into four named sections, each corresponding to a distinct phase of information capture. The sections are sequential in the creation flow but the underlying record is a flat object — there is no nesting per section. All fields are optional except <code class=\"inl\">job<\u002Fcode>, which serves as the record's primary identifier.<\u002Fp>\n\n      <table>\n        <thead>\n          <tr><th style=\"width:80px\">Letter<\u002Fth><th>Section<\u002Fth><th>When it is filled<\u002Fth><\u002Ftr>\n        <\u002Fthead>\n        <tbody>\n          <tr><td class=\"mono\"><strong>P<\u002Fstrong><\u002Ftd><td>Process<\u002Ftd><td>Before the job — what is being done and for whom<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\"><strong>A<\u002Fstrong><\u002Ftd><td>Actions<\u002Ftd><td>During the job — the steps being performed<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\"><strong>D<\u002Fstrong><\u002Ftd><td>Details<\u002Ftd><td>During or after — logistics, timing, contacts<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\"><strong>S<\u002Fstrong><\u002Ftd><td>Story<\u002Ftd><td>After the job — what happened, in plain language<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n\n      <div class=\"sidelabel\">2.2 — Process<\u002Fdiv>\n      <h3>P — Process<\u002Fh3>\n      <table>\n        <thead><tr><th>Field<\u002Fth><th>Key<\u002Fth><th>Req<\u002Fth><th>Description<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>Job title<\u002Ftd><td class=\"mono\">job<\u002Ftd><td>Yes<\u002Ftd><td>Primary identifier. E.g. <em>Replace faucet<\u002Fem>, <em>Site inspection<\u002Fem>.<\u002Ftd><\u002Ftr>\n          <tr><td>Customer<\u002Ftd><td class=\"mono\">customer<\u002Ftd><td>—<\u002Ftd><td>Name of the customer, client, or responsible party.<\u002Ftd><\u002Ftr>\n          <tr><td>Date<\u002Ftd><td class=\"mono\">date<\u002Ftd><td>—<\u002Ftd><td>Work date, ISO 8601 preferred, free text accepted.<\u002Ftd><\u002Ftr>\n          <tr><td>Location<\u002Ftd><td class=\"mono\">location<\u002Ftd><td>—<\u002Ftd><td>Physical address or location descriptor. Free text — no geocoding.<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n\n      <div class=\"sidelabel\">2.3 — Actions<\u002Fdiv>\n      <h3>A — Actions<\u002Fh3>\n      <p>Actions are a list of step items. Each item has a title and optional notes. They function as a lightweight checklist or procedure log.<\u002Fp>\n      <pre class=\"code\">\"actions\": [\n  { \"title\": \"Arrive\",   \"notes\": \"Check scope with customer\" },\n  { \"title\": \"Install\",  \"notes\": \"Replace fixture and seal\" },\n  { \"title\": \"Test\",     \"notes\": \"\" }\n]<\u002Fpre>\n\n      <div class=\"sidelabel\">2.4 — Details &amp; Story<\u002Fdiv>\n      <h3>D — Details · S — Story<\u002Fh3>\n      <p>Details captures who is doing the work, when, and how they can be reached: <code class=\"inl\">worker<\u002Fcode>, <code class=\"inl\">start_time<\u002Fcode>, <code class=\"inl\">end_time<\u002Fcode>, <code class=\"inl\">meeting_time<\u002Fcode>, <code class=\"inl\">customer_phone<\u002Fcode>. Story is the narrative summary — prose, not structured. The distinction between <em>story<\u002Fem> and <em>details<\u002Fem> is the difference between “we found the pipe had corroded at the joint…” and “replaced 15mm copper elbow, applied PTFE tape, pressure tested to 4 bar.”<\u002Fp>\n\n      <div class=\"callout\">\n        <strong>Invariants<\u002Fstrong>\n        <code class=\"inl\">job<\u002Fcode> is the only required field. All scalars are strings. Absent fields are omitted, not null. Actions may be an empty array. The record is flat — no sub-objects per section.\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- §3 URL AS DOCUMENT -->\n  <section id=\"s3\">\n    <div class=\"sechead\">\n      <div class=\"num\">§ 3<\u002Fdiv>\n      <div>\n        <h2>URL-as-document.<\u002Fh2>\n        <div class=\"sub\">The structural shift — why a URL is the document, not a pointer to one.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"body\">\n      <div class=\"sidelabel\">3.1 — The traditional model<\u002Fdiv>\n      <p>A business that produces documents — invoices, job reports, inspection records, delivery notes, proposals — currently chooses between file hosting, platform lock-in, or email attachment. All three share a common assumption: <em>the document is a stored object that must live somewhere before it can be shared.<\u002Fem><\u002Fp>\n\n      <p class=\"pull\">In the URL-as-document model, the document is a URL string that any compatible receiver can render. There is no stored object.<\u002Fp>\n\n      <div class=\"sidelabel\">3.2 — The separation<\u002Fdiv>\n      <h3>The structural alternative<\u002Fh3>\n      <p>The Workpads model separates two things that have historically been bundled:<\u002Fp>\n      <ul>\n        <li><strong>Content<\u002Fstrong> — the data: who, what, when, how much, what happened.<\u002Fli>\n        <li><strong>Presentation<\u002Fstrong> — the template: how the data is displayed, styled, and interacted with.<\u002Fli>\n      <\u002Ful>\n      <p>Content is encoded into the URL string itself, in the fragment — the part after <code class=\"inl\">#<\u002Fcode>. That data never touches a server. Presentation is a template identified by a URI, fetched once, cached locally, and reused for every subsequent render. The rendered document exists only at the moment of viewing, produced by the combination of the two.<\u002Fp>\n\n      <div class=\"sidelabel\">3.3 — Anatomy<\u002Fdiv>\n      <h3>What a share URL actually contains<\u002Fh3>\n      <p>A Workpads record share URL has the form:<\u002Fp>\n      <div class=\"urldemo\"><span class=\"o\">https://<\u002Fspan><span class=\"p\">workpads.me/p<\u002Fspan>#<span class=\"tag\">1bg/<\u002Fspan><span class=\"payload\">eJxVjksKwjAQhq8yZN0LuC9YkApu3IiL2KQ1pE1KZqLQ4t1NU0V08w8z3z9PiOZsLNiwgLfWVZsR8GwQGtVFnXJrbT2bD0Mq<\u002Fspan><span class=\"ch\">&amp;c=Hk2P<\u002Fspan><\u002Fdiv>\n      <p>The fragment contains a deflate-compressed binary frame, base64url-encoded. The first three characters of the fragment (<code class=\"inl\">1bg<\u002Fcode>) are the scheme tag: format version 1, codebook b (svc-basic + financial block), DEFLATE compression. Everything after the <code class=\"inl\">/<\u002Fcode> is the payload. The trailing <code class=\"inl\">&amp;c=<\u002Fcode> is an optional 4-character chain reference linking related records.<\u002Fp>\n\n      <p>For a note share, the structure is identical except the path is <code class=\"inl\">/n<\u002Fcode> and the payload is a compressed JSON object including a <code class=\"inl\">tpl<\u002Fcode> field that names the template URI.<\u002Fp>\n\n      <div class=\"sidelabel\">3.4 — The orchestrator<\u002Fdiv>\n      <h3>The orchestrator page<\u002Fh3>\n      <p>The static page at <code class=\"inl\">workpads.me/p<\u002Fcode> (records) or <code class=\"inl\">workpads.me/n<\u002Fcode> (notes) is a shell with one responsibility: receive a fragment, resolve a template, and render content.<\u002Fp>\n\n      <div class=\"arrows\">1. Parse the URL fragment\n2. Decode the compressed payload\n3. Extract the template URI (note share) or template byte (record)\n4. Check local cache for the template payload\n5. If not cached: fetch from the canonical URI (HTTPS GET, a static JSON file)\n6. If fetch fails: walk the fallback chain (supersedes → built-in default)\n7. Render content using the template inside a sandboxed iframe\n8. Display result<\u002Fdiv>\n\n      <p>The orchestrator page itself never changes. It has no state, no user accounts, no database. Its entire behaviour is determined by what is in the URL fragment. This means it can be hosted on any static hosting provider, cached at CDN edges globally, and served essentially for free at any scale.<\u002Fp>\n\n      <p><em>The orchestrator is not the product. It is infrastructure — the same way a web browser is infrastructure.<\u002Fem><\u002Fp>\n\n      <div class=\"sidelabel\">3.5 — Economics<\u002Fdiv>\n      <h3>Business document volume without storage growth<\u002Fh3>\n      <p>Consider a sole trader who generates 800 job records and 2,400 field notes per year. Under traditional file hosting, that's 40MB+ of stored PDFs growing annually, plus access control, backup, and versioning overhead. Under URL-as-document:<\u002Fp>\n\n      <div class=\"grid3\">\n        <div class=\"card\">\n          <h4>Templates<\u002Fh4>\n          <p>3 templates (invoice, job report, field note), each ~3KB compressed, stored once, cached by every recipient.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <h4>Records<\u002Fh4>\n          <p>3,200 URL strings generated on demand, stored as a few hundred KB of localStorage. The URL <em>is<\u002Fem> the document.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <h4>Scale<\u002Fh4>\n          <p>A business generating 100,000 documents has the same template overhead as one generating 100. Only the URL strings grow.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"sidelabel\">3.6 — Flow direction<\u002Fdiv>\n      <h3>Direction of information flow<\u002Fh3>\n      <div class=\"flow\">\n        <div class=\"step\"><span class=\"label\">Business<\u002Fspan>Generates a URL string from a typed record using its own template.<\u002Fdiv>\n        <div class=\"arr\">→<\u002Fdiv>\n        <div class=\"step\"><span class=\"label\">Transport<\u002Fspan>SMS · QR · WhatsApp · clipboard. Hash fragment never hits a server.<\u002Fdiv>\n        <div class=\"arr\">→<\u002Fdiv>\n        <div class=\"step\"><span class=\"label\">Customer<\u002Fspan>Opens the URL — orchestrator decodes, renders, optionally ingests into local app.<\u002Fdiv>\n      <\u002Fdiv>\n      <p>Customer-to-business works identically. Two businesses that have both adopted the Standard exchange structured records — job handoffs, purchase orders, delivery confirmations — as URL strings. EDI did this for decades; the difference is the barrier to entry. EDI needs a VAN, trading partner agreements, dedicated software. The URL model needs a browser.<\u002Fp>\n\n      <div class=\"callout\">\n        <strong>Offline by default<\u002Fstrong>\n        Once a template is cached, it renders offline. The orchestrator page itself can be cached as a PWA. A field worker with no signal can receive a URL via SMS, open it, and see the document rendered correctly from cached templates.\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- §4 TEMPLATE SYSTEM -->\n  <section id=\"s4\">\n    <div class=\"sechead\">\n      <div class=\"num\">§ 4<\u002Fdiv>\n      <div>\n        <h2>The template system.<\u002Fh2>\n        <div class=\"sub\">How presentation is authored, identified, distributed, cached, rendered.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"body\">\n      <div class=\"sidelabel\">4.1 — Premise<\u002Fdiv>\n      <p>A template is a self-contained bundle — HTML, CSS, and (in verified cases) JS — that takes a Workpads data object and produces a rendered view. Templates are separate from records. <em>A record is permanent data; a template is a replaceable lens through which data is shown.<\u002Fem><\u002Fp>\n\n      <div class=\"sidelabel\">4.2 — Identity<\u002Fdiv>\n      <h3>Template identity<\u002Fh3>\n      <p>Every template has two identifiers: a canonical URI (globally unique, stable across all installs) and a local manifest key (same string, used as the storage key on-device).<\u002Fp>\n      <pre class=\"code\">urn:workpads:tpl:note:default:v1          <span class=\"c\">← built-in<\u002Fspan>\nurn:workpads:tpl:note:invoice-clean:v2    <span class=\"c\">← community<\u002Fspan>\nhttps://example.com/tpls/site-report.json <span class=\"c\">← third-party<\u002Fspan><\u002Fpre>\n      <p>URN-form identifiers are reserved for first-party and built-in templates. Third-party authors use an HTTPS URL they control. The <code class=\"inl\">version<\u002Fcode> field is a positive integer — the registry accepts a template only when <code class=\"inl\">incoming.version &gt; stored.version<\u002Fcode>, allowing in-place upgrades without reinstall.<\u002Fp>\n\n      <div class=\"sidelabel\">4.3 — Schema types<\u002Fdiv>\n      <h3>Four schema types<\u002Fh3>\n      <table>\n        <thead><tr><th style=\"width:80px\">Schema<\u002Fth><th>Description<\u002Fth><th>Payload fields<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td class=\"mono\"><strong>A<\u002Fstrong><\u002Ftd><td>Single HTML string with <code class=\"inl\">{{placeholders}}<\u002Fcode><\u002Ftd><td><code class=\"inl\">html, css<\u002Fcode><\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\"><strong>B<\u002Fstrong><\u002Ftd><td>Named slot map — each slot rendered independently<\u002Ftd><td><code class=\"inl\">html, css, slots<\u002Fcode><\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\"><strong>P<\u002Fstrong><\u002Ftd><td>Ordered sections — a mini-presentation<\u002Ftd><td><code class=\"inl\">css, sections<\u002Fcode><\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\"><strong>C<\u002Fstrong><\u002Ftd><td>Component / partial — not rendered directly<\u002Ftd><td><code class=\"inl\">html, css, interface<\u002Fcode><\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n\n      <h4>Template engine syntax (A, B, P)<\u002Fh4>\n      <pre class=\"code\"><span class=\"k\">{{fieldName}}<\u002Fspan>           <span class=\"c\">variable substitution (HTML-escaped)<\u002Fspan>\n<span class=\"k\">{{a.b.c}}<\u002Fspan>               <span class=\"c\">dot-path into nested objects<\u002Fspan>\n<span class=\"k\">{{#key}}…{{/key}}<\u002Fspan>       <span class=\"c\">conditional block — renders if truthy<\u002Fspan>\n<span class=\"k\">{{^key}}…{{/key}}<\u002Fspan>       <span class=\"c\">inverted block — renders if falsy<\u002Fspan><\u002Fpre>\n\n      <h4>A minimal Schema-A template<\u002Fh4>\n      <pre class=\"code\">{\n  <span class=\"k\">\"uri\"<\u002Fspan>:      <span class=\"s\">\"urn:workpads:tpl:note:clean:v1\"<\u002Fspan>,\n  <span class=\"k\">\"schema\"<\u002Fspan>:   <span class=\"s\">\"A\"<\u002Fspan>,\n  <span class=\"k\">\"type\"<\u002Fspan>:     <span class=\"s\">\"note\"<\u002Fspan>,\n  <span class=\"k\">\"version\"<\u002Fspan>:  <span class=\"n\">1<\u002Fspan>,\n  <span class=\"k\">\"platforms\"<\u002Fspan>:<span class=\"s\">[\"all\"]<\u002Fspan>,\n  <span class=\"k\">\"name\"<\u002Fspan>:     <span class=\"s\">\"Clean Note\"<\u002Fspan>,\n  <span class=\"k\">\"html\"<\u002Fspan>:     <span class=\"s\">\"&lt;div class='wn'&gt;&lt;div class='wn-ts'&gt;{{ts}}&lt;/div&gt;&lt;div class='wn-text'&gt;{{text}}&lt;/div&gt;&lt;/div&gt;\"<\u002Fspan>,\n  <span class=\"k\">\"css\"<\u002Fspan>:      <span class=\"s\">\".wn{padding:12px;font-family:sans-serif}.wn-ts{font-size:10px;color:#888}\"<\u002Fspan>\n}<\u002Fpre>\n\n      <div class=\"sidelabel\">4.4 — Platforms<\u002Fdiv>\n      <h3>Platform targeting<\u002Fh3>\n      <p>Templates declare which platforms they are designed for. The runtime uses this to filter the picker and the fallback chain.<\u002Fp>\n      <div class=\"chips\">\n        <span class=\"chip\">all<\u002Fspan>\n        <span class=\"chip\">kaios — 240×320, D-pad<\u002Fspan>\n        <span class=\"chip\">mobile — touch<\u002Fspan>\n        <span class=\"chip\">desktop — wide + mouse<\u002Fspan>\n        <span class=\"chip\">print — PDF export<\u002Fspan>\n      <\u002Fdiv>\n      <p>A template may list multiple values: <code class=\"inl\">[\"mobile\", \"desktop\"]<\u002Fcode>. For single-file pages that serve all platforms, declare <code class=\"inl\">platforms: [\"all\"]<\u002Fcode> and write responsive CSS with breakpoints.<\u002Fp>\n\n      <div class=\"sidelabel\">4.5 — Carry mechanism<\u002Fdiv>\n      <h3>Page-embedded templates<\u002Fh3>\n      <p>A static HTML page can carry a template payload in a <code class=\"inl\">&lt;script&gt;<\u002Fcode> tag. When a user visits the page in the in-app browser, the app detects and optionally ingests it — no server round-trip required.<\u002Fp>\n      <pre class=\"code\"><span class=\"c\">&lt;!-- Preferred form: one &lt;script&gt; per platform variant --&gt;<\u002Fspan>\n&lt;script type=<span class=\"s\">\"application/workpads-template\"<\u002Fspan> data-platform=<span class=\"s\">\"kaios\"<\u002Fspan>&gt;\n  eJyNj0EKwjAQRfc...   <span class=\"c\">← fflate-deflated, base64url template payload<\u002Fspan>\n&lt;/script&gt;\n&lt;script type=<span class=\"s\">\"application/workpads-template\"<\u002Fspan> data-platform=<span class=\"s\">\"desktop\"<\u002Fspan>&gt;\n  eJyNk1...\n&lt;/script&gt;<\u002Fpre>\n      <p>The registry's <code class=\"inl\">detectOnPage()<\u002Fcode> scanner reads the <code class=\"inl\">data-platform<\u002Fcode> attribute and matches it against the current runtime's platform token. On detection, the app presents a consent prompt — template name, origin domain, trust level — before ingesting. Refused URIs are recorded and not surfaced again from the same origin.<\u002Fp>\n\n      <div class=\"sidelabel\">4.6 — Sandboxing<\u002Fdiv>\n      <h3>Sandboxed JavaScript<\u002Fh3>\n      <p>Templates in their basic forms (Schemas A, B, P) are pure HTML and CSS with string substitution. They cannot execute code. This covers the majority of business document use cases. When a template includes JavaScript — Schema C, available only to verified <em>official<\u002Fem> trust templates — it executes inside a sandboxed iframe:<\u002Fp>\n\n      <div class=\"arrows\">workpads.me/n  (orchestrator — cannot be touched by template code)\n    └── &lt;iframe sandbox=\"allow-scripts\"&gt;\n            ← template HTML + CSS + JS loaded here\n            ← record data passed in via postMessage\n            → template renders, animates, responds to interaction\n            → cannot access parent page, cookies, localStorage, or DOM<\u002Fdiv>\n\n      <p>The sandboxing is not a limitation added for safety — it is the mechanism that makes arbitrary third-party templates safe to execute. The orchestrator page trusts no template code. Content data is passed through a defined channel. The template cannot exfiltrate it.<\u002Fp>\n\n      <div class=\"sidelabel\">4.7 — Fallback chain<\u002Fdiv>\n      <h3>Fallback chain<\u002Fh3>\n      <p>When rendering, the system walks this chain and stops at the first available template:<\u002Fp>\n      <ol>\n        <li>Requested URI (from manifest + payload cache)<\u002Fli>\n        <li>Fetch canonical URI (if HTTPS and online)<\u002Fli>\n        <li>Fetch fallback URI (from <code class=\"inl\">lineage.supersedes<\u002Fcode>, if set)<\u002Fli>\n        <li>Built-in default: <code class=\"inl\">urn:workpads:tpl:note:default:v1<\u002Fcode><\u002Fli>\n      <\u002Fol>\n      <p>The built-in default is hardcoded in the app binary and always available. It is the guaranteed terminus — rendering never fails.<\u002Fp>\n\n      <div class=\"callout\">\n        <strong>Trust tiers<\u002Fstrong>\n        built-in → official → community → local. Only built-in and official may execute JS. Community templates are pure HTML/CSS. Trust is encoded in the manifest and enforced by the runtime before any JS executes.\n      <\u002Fdiv>\n\n      <div class=\"sidelabel\">4.8 — Registry<\u002Fdiv>\n      <h3>Registry API<\u002Fh3>\n      <pre class=\"code\"><span class=\"c\">// Query<\u002Fspan>\nTemplateRegistry.query(opts)          <span class=\"c\">// { type, schema, domain, cached } → entries[]<\u002Fspan>\nTemplateRegistry.allEntries()         <span class=\"c\">// all entries, built-in first<\u002Fspan>\nTemplateRegistry.getEntry(uri)        <span class=\"c\">// manifest entry or null<\u002Fspan>\nTemplateRegistry.getPayload(uri)      <span class=\"c\">// payload or built-in fallback<\u002Fspan>\n\n<span class=\"c\">// Write<\u002Fspan>\nTemplateRegistry.ingest(tplObj, origin)         <span class=\"c\">// → { ok, entry, isNew, isUpgrade }<\u002Fspan>\nTemplateRegistry.ingestEncoded(b64str, origin)  <span class=\"c\">// decode + ingest<\u002Fspan>\nTemplateRegistry.remove(uri)                    <span class=\"c\">// removes manifest + payload<\u002Fspan>\n\n<span class=\"c\">// Discovery<\u002Fspan>\nTemplateRegistry.detectOnPage(doc)    <span class=\"c\">// → not-yet-ingested templates<\u002Fspan>\nTemplateRegistry.hasRefused(uri)      <span class=\"c\">// boolean<\u002Fspan>\nTemplateRegistry.recordRefusal(uri)   <span class=\"c\">// persists refusal<\u002Fspan>\n\n<span class=\"c\">// Render<\u002Fspan>\nTemplateRegistry.render(uri, data)    <span class=\"c\">// → HTML string — always succeeds<\u002Fspan><\u002Fpre>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- §5 CODEC -->\n  <section id=\"s5\">\n    <div class=\"sechead\">\n      <div class=\"num\">§ 5<\u002Fdiv>\n      <div>\n        <h2>Codec &amp; compact encoding.<\u002Fh2>\n        <div class=\"sub\">pads-v1 binary frame · DEFLATE · base64url · <code class=\"inl\">iHX7-3F9KQ2<\u002Fcode><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"body\">\n      <div class=\"sidelabel\">5.1 — URL structure<\u002Fdiv>\n      <p>The codec converts a workpad record to a compact string suitable for use as a URL hash fragment, so a record can be shared as a single URL without server involvement. The encoded string is placed after the <code class=\"inl\">#<\u002Fcode> character — hash fragments are not sent to servers by browsers, ensuring the record data remains client-side during transmission.<\u002Fp>\n\n      <pre class=\"code\">https://workpads.me/p#<span class=\"k\">1bg/<\u002Fspan>&lt;base64url&gt;<span class=\"k\">&amp;c=<\u002Fspan>&lt;chainRef&gt;<\u002Fpre>\n\n      <table>\n        <thead><tr><th>Component<\u002Fth><th>Value<\u002Fth><th>Description<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>Origin<\u002Ftd><td class=\"mono\">https://workpads.me<\u002Ftd><td>Canonical base URL for share links<\u002Ftd><\u002Ftr>\n          <tr><td>Path<\u002Ftd><td class=\"mono\">/p<\u002Ftd><td>Workpad receiver path<\u002Ftd><\u002Ftr>\n          <tr><td>Scheme tag<\u002Ftd><td class=\"mono\">1bg<\u002Ftd><td>3-character encoding descriptor<\u002Ftd><\u002Ftr>\n          <tr><td>Separator<\u002Ftd><td class=\"mono\">/<\u002Ftd><td>Literal — between tag and payload<\u002Ftd><\u002Ftr>\n          <tr><td>Payload<\u002Ftd><td class=\"mono\">&lt;base64url&gt;<\u002Ftd><td>Compressed, base64url-encoded binary frame<\u002Ftd><\u002Ftr>\n          <tr><td>Chain ref<\u002Ftd><td class=\"mono\">&amp;c=…<\u002Ftd><td>Optional 4-char base64url chain reference<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n\n      <h4>Scheme tag positions<\u002Fh4>\n      <p>The scheme tag is always three ASCII characters: position 0 is the pads format version, position 1 is the codebook letter, position 2 is the compression algorithm. <code class=\"inl\">1bg<\u002Fcode> reads as “pads-v1, codebook b (svc-basic + financial block), DEFLATE via fflate.” Detection is a regex: <code class=\"inl\">/^[0-9][a-z][a-z]\\//<\u002Fcode>.<\u002Fp>\n\n      <div class=\"sidelabel\">5.2 — Frame<\u002Fdiv>\n      <h3>pads-v1 binary frame<\u002Fh3>\n      <pre class=\"code\"><span class=\"c\">Byte 0:    Template identifier (uint8)        — 0x01 = svc-basic v1<\u002Fspan>\n<span class=\"c\">Bytes 1–2: Presence flags (uint16, big-endian)<\u002Fspan>\n<span class=\"c\">Body:      [low scalars][actions blob][high scalars][financial block]<\u002Fspan><\u002Fpre>\n\n      <p>The presence flags occupy bytes 1 and 2 as a single 16-bit big-endian unsigned integer. A bit is <code class=\"inl\">1<\u002Fcode> if the corresponding field has a value and its blob is included in the frame.<\u002Fp>\n\n      <div class=\"callout\">\n        <strong>Implementation critical<\u002Fstrong>\n        Read flags as <code class=\"inl\">(frame[1] &lt;&lt; 8) | frame[2]<\u002Fcode> — big-endian. The little-endian byte-swap silently produces wrong flag values, fields decode as the wrong type, byte offsets cascade incorrectly, and the record appears corrupt or partially empty.\n      <\u002Fdiv>\n\n      <h4>svc-basic field slots — codebook b<\u002Fh4>\n      <table>\n        <thead><tr><th>Bit<\u002Fth><th>Mask<\u002Fth><th>Field<\u002Fth><th>Type<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td class=\"mono\">0<\u002Ftd><td class=\"mono\">0x0001<\u002Ftd><td class=\"mono\">job<\u002Ftd><td>scalar<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\">1<\u002Ftd><td class=\"mono\">0x0002<\u002Ftd><td class=\"mono\">customer<\u002Ftd><td>scalar<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\">2<\u002Ftd><td class=\"mono\">0x0004<\u002Ftd><td class=\"mono\">date<\u002Ftd><td>scalar<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\">3<\u002Ftd><td class=\"mono\">0x0008<\u002Ftd><td class=\"mono\">location<\u002Ftd><td>scalar<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\">4<\u002Ftd><td class=\"mono\">0x0010<\u002Ftd><td class=\"mono\">meeting_time<\u002Ftd><td>scalar<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\">5<\u002Ftd><td class=\"mono\">0x0020<\u002Ftd><td class=\"mono\">start_time<\u002Ftd><td>scalar<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\">6<\u002Ftd><td class=\"mono\">0x0040<\u002Ftd><td class=\"mono\">end_time<\u002Ftd><td>scalar<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\">7<\u002Ftd><td class=\"mono\">0x0080<\u002Ftd><td class=\"mono\">customer_phone<\u002Ftd><td>scalar<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\">8<\u002Ftd><td class=\"mono\">0x0100<\u002Ftd><td class=\"mono\">worker<\u002Ftd><td>scalar<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\">9<\u002Ftd><td class=\"mono\">0x0200<\u002Ftd><td class=\"mono\">actions<\u002Ftd><td>actions blob<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\">10<\u002Ftd><td class=\"mono\">0x0400<\u002Ftd><td class=\"mono\">details<\u002Ftd><td>scalar<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\">11<\u002Ftd><td class=\"mono\">0x0800<\u002Ftd><td class=\"mono\">story<\u002Ftd><td>scalar<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\">12<\u002Ftd><td class=\"mono\">0x1000<\u002Ftd><td>financial block<\u002Ftd><td>structured<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\">13–15<\u002Ftd><td class=\"mono\">—<\u002Ftd><td colspan=\"2\">reserved for future use<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n\n      <div class=\"sidelabel\">5.3 — Worked example<\u002Fdiv>\n      <h3>Worked example<\u002Fh3>\n      <p>The record:<\u002Fp>\n      <pre class=\"code\">{ <span class=\"k\">\"job\"<\u002Fspan>: <span class=\"s\">\"Fix tap\"<\u002Fspan>, <span class=\"k\">\"customer\"<\u002Fspan>: <span class=\"s\">\"Alice\"<\u002Fspan>,\n  <span class=\"k\">\"actions\"<\u002Fspan>: [{ <span class=\"k\">\"title\"<\u002Fspan>: <span class=\"s\">\"Arrive\"<\u002Fspan>, <span class=\"k\">\"notes\"<\u002Fspan>: <span class=\"s\">\"\"<\u002Fspan> }] }<\u002Fpre>\n\n      <p>Sets bits 0 (<code class=\"inl\">job<\u002Fcode>), 1 (<code class=\"inl\">customer<\u002Fcode>), and 9 (<code class=\"inl\">actions<\u002Fcode>) — <code class=\"inl\">flags = 0x0203<\u002Fcode> — yielding the byte stream:<\u002Fp>\n\n      <pre class=\"code\"><span class=\"n\">0x01<\u002Fspan>              <span class=\"c\">template = svc-basic<\u002Fspan>\n<span class=\"n\">0x02 0x03<\u002Fspan>         <span class=\"c\">flags big-endian: 0x0203<\u002Fspan>\n<span class=\"n\">0x00 0x07<\u002Fspan>         <span class=\"c\">job length = 7<\u002Fspan>\n46 69 78 20 74 61 70   <span class=\"c\">\"Fix tap\"<\u002Fspan>\n<span class=\"n\">0x00 0x05<\u002Fspan>         <span class=\"c\">customer length = 5<\u002Fspan>\n41 6C 69 63 65    <span class=\"c\">\"Alice\"<\u002Fspan>\n<span class=\"n\">0x01<\u002Fspan>              <span class=\"c\">action count = 1<\u002Fspan>\n<span class=\"n\">0x00 0x06<\u002Fspan>         <span class=\"c\">title length = 6<\u002Fspan>\n41 72 72 69 76 65 <span class=\"c\">\"Arrive\"<\u002Fspan>\n<span class=\"n\">0x00 0x00<\u002Fspan>         <span class=\"c\">notes length = 0<\u002Fspan><\u002Fpre>\n\n      <p>Compressed with <code class=\"inl\">deflateSync<\u002Fcode> → base64url → prepend <code class=\"inl\">1bg/<\u002Fcode> → append to <code class=\"inl\">https://workpads.me/p#<\u002Fcode>. Full record with five actions typically lands at 260–300 characters of URL — well within SMS message limits and QR code capacity.<\u002Fp>\n\n      <h4>Size characteristics<\u002Fh4>\n      <table>\n        <thead><tr><th>Record content<\u002Fth><th>Hash fragment length<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>Job only<\u002Ftd><td class=\"mono\">~60 chars<\u002Ftd><\u002Ftr>\n          <tr><td>Job + customer + date + location<\u002Ftd><td class=\"mono\">~100 chars<\u002Ftd><\u002Ftr>\n          <tr><td>Full record (all fields, 2 actions)<\u002Ftd><td class=\"mono\">~180–220 chars<\u002Ftd><\u002Ftr>\n          <tr><td>Full record (all fields, 5 actions)<\u002Ftd><td class=\"mono\">~260–300 chars<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n\n      <div class=\"sidelabel\">5.4 — Compatibility<\u002Fdiv>\n      <h3>Backwards compatibility<\u002Fh3>\n      <p>Codebook-a URLs (<code class=\"inl\">1ag/<\u002Fcode>) remain valid indefinitely. Decoders check the scheme tag character at position 1 and route accordingly. New encoders emit <code class=\"inl\">1bg/<\u002Fcode>. Legacy pre-pads URLs (<code class=\"inl\">alg=bitpad-v1&amp;d=…<\u002Fcode>) are not cross-compatible and should be rejected by v1 decoders. The codec is registered in the bitpads registry as <code class=\"inl\">iHX7-3F9KQ2<\u002Fcode>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- §6 RECORD SCHEMA + §7 NAMING -->\n  <section id=\"s6\">\n    <div class=\"sechead\">\n      <div class=\"num\">§ 6 · § 7<\u002Fdiv>\n      <div>\n        <h2>Record schema &amp; naming.<\u002Fh2>\n        <div class=\"sub\">svc-basic v1 · canonical URI shape · stable identity.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"body\">\n      <div class=\"sidelabel\">6 — svc-basic<\u002Fdiv>\n      <p>The first-party record schema is <code class=\"inl\">svc-basic<\u002Fcode>, a field-service basic template covering the fifteen scalar fields and one actions blob declared in §5. Future template versions may add fields. Decoders encountering an unknown template byte should reject gracefully rather than partially decoding.<\u002Fp>\n\n      <p>Every record carries system-managed identity fields alongside its PADS content:<\u002Fp>\n      <table>\n        <thead><tr><th>Field<\u002Fth><th>Key<\u002Fth><th>Set by<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td>Record ID<\u002Ftd><td class=\"mono\">id<\u002Ftd><td>RecordService on create<\u002Ftd><\u002Ftr>\n          <tr><td>Created at<\u002Ftd><td class=\"mono\">createdAt<\u002Ftd><td>RecordService on create — ISO 8601<\u002Ftd><\u002Ftr>\n          <tr><td>Updated at<\u002Ftd><td class=\"mono\">updatedAt<\u002Ftd><td>RecordService on update<\u002Ftd><\u002Ftr>\n          <tr><td>Received at<\u002Ftd><td class=\"mono\">receivedAt<\u002Ftd><td>RecordService.storeReceived — incoming URL<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n\n      <div class=\"sidelabel\">7 — Naming<\u002Fdiv>\n      <p>Workpads identifiers follow a stable URN convention for first-party objects and an HTTPS URL convention for third-party. The shape is <code class=\"inl\">urn:workpads:{kind}:{type}:{name}:{version}<\u002Fcode>. Examples: <code class=\"inl\">urn:workpads:tpl:note:default:v1<\u002Fcode>, <code class=\"inl\">urn:workpads:rec:svc-basic:v1<\u002Fcode>. Versions are monotonic positive integers — never semver, never decimal — because the registry's upgrade semantics rely on numeric comparison.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- §8 RecordService + §9 Storage Adapter -->\n  <section id=\"s7-9\">\n    <div class=\"sechead\">\n      <div class=\"num\">§ 8 · § 9<\u002Fdiv>\n      <div>\n        <h2>RecordService &amp; storage adapter.<\u002Fh2>\n        <div class=\"sub\">The service surface every implementation exposes.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"body\">\n      <div class=\"sidelabel\">8 — RecordService<\u002Fdiv>\n      <p>RecordService is the high-level interface a Workpads app exposes to its UI layer. It is the only correct place to mutate records — services below (StorageAdapter) are not invoked directly by screens.<\u002Fp>\n      <pre class=\"code\">RecordService.create(initialFields)         <span class=\"c\">→ Promise&lt;record&gt;<\u002Fspan>\nRecordService.save(id, fields)              <span class=\"c\">→ Promise&lt;record&gt;<\u002Fspan>\nRecordService.get(id)                       <span class=\"c\">→ Promise&lt;record | null&gt;<\u002Fspan>\nRecordService.list({ filter, sort })        <span class=\"c\">→ Promise&lt;record[]&gt;<\u002Fspan>\nRecordService.delete(id)                    <span class=\"c\">→ Promise&lt;ok&gt;<\u002Fspan>\n\nRecordService.encodeUrl(id)                 <span class=\"c\">→ Promise&lt;url string&gt;<\u002Fspan>\nRecordService.decodeUrl(url)                <span class=\"c\">→ Promise&lt;record&gt;<\u002Fspan>\nRecordService.storeReceived(record, origin) <span class=\"c\">→ Promise&lt;record&gt;<\u002Fspan>\n\nRecordService.findByChainRef(ref)           <span class=\"c\">→ Promise&lt;record[]&gt;<\u002Fspan>\nRecordService.genChainRef()                 <span class=\"c\">→ 4-char base64url string<\u002Fspan><\u002Fpre>\n\n      <div class=\"sidelabel\">9 — Storage<\u002Fdiv>\n      <p>StorageAdapter is the pluggable persistence contract. Reference implementations use localStorage on KaiOS and the web; alternative adapters target IndexedDB, SQLite (via WASM), or the filesystem (CLI). The contract is narrow: read, write, delete, listKeys. Adapters do not interpret record contents — that is RecordService's job.<\u002Fp>\n      <pre class=\"code\">StorageAdapter.read(key)                    <span class=\"c\">→ Promise&lt;string | null&gt;<\u002Fspan>\nStorageAdapter.write(key, value)            <span class=\"c\">→ Promise&lt;ok&gt;<\u002Fspan>\nStorageAdapter.delete(key)                  <span class=\"c\">→ Promise&lt;ok&gt;<\u002Fspan>\nStorageAdapter.listKeys(prefix)             <span class=\"c\">→ Promise&lt;string[]&gt;<\u002Fspan><\u002Fpre>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- §10 Two-Build, §11 Chain protocol, §12 BASICS -->\n  <section id=\"s10\">\n    <div class=\"sechead\">\n      <div class=\"num\">§ 10<\u002Fdiv>\n      <div>\n        <h2>Two-build strategy.<\u002Fh2>\n        <div class=\"sub\">KaiOS 3.x baseline, KaiOS 2.5 progressive — same codec, different runtime.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"body\">\n      <p>The reference KaiOS implementation ships as two builds from one source: a 3.x build that uses Gecko 63+ APIs (ES2017, modern DOM, IndexedDB optional), and a 2.5 build that compiles down to ES5 with no async/await and a polyfilled Promise. Both consume the same <code class=\"inl\">@workpads/codec<\u002Fcode> package; the build pipeline is run by <code class=\"inl\">workpadsdev-cli build:3.0<\u002Fcode> and <code class=\"inl\">build:2.5<\u002Fcode>. The two-build strategy ensures the standard works on the broadest reasonable mobile baseline without forcing the 3.x experience to regress.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s11\">\n    <div class=\"sechead\">\n      <div class=\"num\">§ 11<\u002Fdiv>\n      <div>\n        <h2>Chain protocol.<\u002Fh2>\n        <div class=\"sub\">Linking sovereign records without a shared database.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"body\">\n      <p>Records reference other records by <strong>chain reference<\u002Fstrong>, a 4-character base64url string (3 random bytes). A quote and its approval are two sovereign records linked by the same chain ref. A multi-worker job pre-seeds the chain so each worker's record arrives carrying the same identifier. The chain reference is appended to the share URL as <code class=\"inl\">&amp;c=&lt;ref&gt;<\u002Fcode> and stored on decoded records as <code class=\"inl\">_chainRef<\u002Fcode> for local lookup.<\u002Fp>\n\n      <p>The chain protocol is the v0.2 mechanism that lets two sovereign devices model a multi-step business interaction — quote → approval → invoice → payment — without either device depending on the other's infrastructure. Each record is complete on its own. The chain ref is the lightweight glue.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"s12\">\n    <div class=\"sechead\">\n      <div class=\"num\">§ 12<\u002Fdiv>\n      <div>\n        <h2>BASICS conformance.<\u002Fh2>\n        <div class=\"sub\">Workpads as a Core-tier BASICS product standard.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"body\">\n      <p>The Workpads Standard conforms to BASICS v0.1.1 at the Core tier. BASICS provides the meta-framework for interoperability claims, deviation registration, and compatibility policy. If you are building a product on Workpads and want a formal conformance claim, you implement §5 faithfully, run <code class=\"inl\">workpadsdev-cli conform<\u002Fcode> for the WP-CONF-001 through WP-CONF-004 baseline, and register any deviations in your own <code class=\"inl\">deviation-registry.md<\u002Fcode> following the BASICS pattern.<\u002Fp>\n\n      <p>Formal BASICS conformance is not required to implement Workpads. It is a signal to other implementors that your product has a documented interoperability posture.<\u002Fp>\n\n      <h4>Baseline conformance rules<\u002Fh4>\n      <table>\n        <thead><tr><th>Rule<\u002Fth><th>Check<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td class=\"mono\">WP-CONF-001<\u002Ftd><td>Manifest present<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\">WP-CONF-002<\u002Ftd><td><code class=\"inl\">@workpads/codec<\u002Fcode> in package.json<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\">WP-CONF-003<\u002Ftd><td><code class=\"inl\">softkeys.yaml<\u002Fcode> present (KaiOS targets)<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\">WP-CONF-004<\u002Ftd><td>Codec round-trip test passes<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div class=\"pagebreak\">— § —<\u002Fdiv>\n\n  <!-- §13 Ecosystem -->\n  <section id=\"s13\">\n    <div class=\"sechead\">\n      <div class=\"num\">§ 13<\u002Fdiv>\n      <div>\n        <h2>The ecosystem.<\u002Fh2>\n        <div class=\"sub\">Every repository, its role, and how they connect.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"body\">\n      <p>The Workpads Standard is supported by a set of reference products maintained by Babb. These are the canonical implementations — not the only ones.<\u002Fp>\n\n      <table>\n        <thead><tr><th>Repo<\u002Fth><th>Role<\u002Fth><th>Status<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td class=\"mono\">workpads-standard<\u002Ftd><td>Normative specification (this document)<\u002Ftd><td>v0.1 live<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\">workpads-codec<\u002Ftd><td><code class=\"inl\">@workpads/codec<\u002Fcode> npm package — implements §5<\u002Ftd><td>v0.1<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\">workpads-cli<\u002Ftd><td>CLI reference, used for integration testing<\u002Ftd><td>v0.x<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\">workpadsdev-cli<\u002Ftd><td>Developer toolchain — build, packaging, conformance<\u002Ftd><td>v0.1<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\">workpadskaios<\u002Ftd><td>KaiOS 3.x reference app — full implementation, D-pad<\u002Ftd><td>v0.1<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\">workpadsdotme<\u002Ftd><td>Web reference app (<em>workpads.me<\u002Fem>) — three-column layout<\u002Ftd><td>active<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\">workpads-basicsconform<\u002Ftd><td>Internal research control plane — decision log, deviation registry<\u002Ftd><td>internal<\u002Ftd><\u002Ftr>\n          <tr><td class=\"mono\">workpads<\u002Ftd><td>Original pre-2026 architecture documents<\u002Ftd><td>archived<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n\n      <h3>Encode path · sender<\u002Fh3>\n      <div class=\"arrows\">User fills in wizard (workpadskaios or workpadsdotme)\n  → RecordService.create() / save()\n  → RecordService.encodeUrl()\n      → WPCodec.encode(record)\n          → padsEncode() → deflate → base64url\n          → prepend scheme tag \"1bg/\"\n          → prepend \"https://workpads.me/p#\"\n  → URL displayed / shared via SMS / QR<\u002Fdiv>\n\n      <h3>Decode path · recipient<\u002Fh3>\n      <div class=\"arrows\">Recipient opens workpads.me/p#1bg/&lt;payload&gt;\n  → /p/index.html (standalone receiver)\n      → inline decode-only codec\n          → strip scheme tag → base64url decode → inflate → padsDecode()\n      → record rendered in browser (no app required)\n\nOR recipient opens URL in workpadskaios or workpadsdotme\n  → App.handleIncoming(url)\n      → RecordService.decodeUrl(url)\n      → RecordService.storeReceived(decoded)\n      → record appears in received list<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- §14 Reference apps -->\n  <section id=\"s14\">\n    <div class=\"sechead\">\n      <div class=\"num\">§ 14<\u002Fdiv>\n      <div>\n        <h2>Reference apps.<\u002Fh2>\n        <div class=\"sub\">workpadskaios · workpadsdotme — same service layer, different runtimes.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"body\">\n      <div class=\"grid2\">\n        <div class=\"card\">\n          <h4>workpadskaios — KaiOS 3.x<\u002Fh4>\n          <p><strong>240×320 · D-pad · no touch · no framework.<\u002Fstrong> The first complete Workpads application, proving the standard works on resource-constrained hardware with no account, no server, and no framework dependency. Two-engine design: Exchange Engine (records, sharing, receiving) plus Learning Engine (notes, activity). Entirely D-pad driven — ArrowLeft/Right for panels, Enter/CSK for confirm, SoftLeft/Backspace for back, SoftRight for save, <code class=\"inl\">*<\u002Fcode> or long-press CSK for quick note.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"card\">\n          <h4>workpadsdotme — Web<\u002Fh4>\n          <p><strong>workpads.me · mouse + keyboard · responsive.<\u002Fstrong> Three-column layout: records list, centre wizard/view, personal-notes panel. Hash-routed screens: <code class=\"inl\">#/<\u002Fcode>, <code class=\"inl\">#/new<\u002Fcode>, <code class=\"inl\">#/edit/:id<\u002Fcode>, <code class=\"inl\">#/view/:id<\u002Fcode>, <code class=\"inl\">#/share/:id<\u002Fcode>. The same service layer (StorageAdapter, RecordService, ActivityService, PersonalService, BlockRegistry) as workpadskaios, adapted for wider viewports. <code class=\"inl\">/p<\u002Fcode> is a standalone receiver page that decodes any incoming share URL without requiring the app.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h3 style=\"margin-top: 40px;\">workpads.me · in the browser<\u002Fh3>\n      <p>Three screenshots of the web app — list view, wizard, and the standalone <code class=\"inl\">/p<\u002Fcode> receiver page that opens any share URL.<\u002Fp>\n      <div class=\"figgrid web\">\n        <figure style=\"margin: 0;\">\n          <div class=\"browserframe\">\n            <div class=\"bbar\">\n              <span class=\"bdot\"><\u002Fspan><span class=\"bdot\"><\u002Fspan><span class=\"bdot\"><\u002Fspan>\n              <span class=\"burl\">workpads.me<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"bbody\">\n              <image-slot id=\"wpdotme-home\" placeholder=\"workpads.me home — list + wizard + panels\"><\u002Fimage-slot>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <figcaption class=\"figcap\"><span class=\"seq\">FIG · 14.1<\u002Fspan>workpads.me — home / list view<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fdiv>\n      <div class=\"figgrid\" style=\"grid-template-columns: 1fr 1fr; margin-top: 18px;\">\n        <figure style=\"margin: 0;\">\n          <div class=\"browserframe\">\n            <div class=\"bbar\">\n              <span class=\"bdot\"><\u002Fspan><span class=\"bdot\"><\u002Fspan><span class=\"bdot\"><\u002Fspan>\n              <span class=\"burl\">workpads.me/#/new<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"bbody\">\n              <image-slot id=\"wpdotme-wizard\" placeholder=\"PADS 4-step wizard — Process / Actions / Details / Story\"><\u002Fimage-slot>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <figcaption class=\"figcap\"><span class=\"seq\">FIG · 14.2<\u002Fspan>4-step PADS wizard<\u002Ffigcaption>\n        <\u002Ffigure>\n        <figure style=\"margin: 0;\">\n          <div class=\"browserframe\">\n            <div class=\"bbar\">\n              <span class=\"bdot\"><\u002Fspan><span class=\"bdot\"><\u002Fspan><span class=\"bdot\"><\u002Fspan>\n              <span class=\"burl\">workpads.me/p#1bg/eJxVjk…<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"bbody\">\n              <image-slot id=\"wpdotme-receiver\" placeholder=\"/p receiver — decoded record rendered through cached template\"><\u002Fimage-slot>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <figcaption class=\"figcap\"><span class=\"seq\">FIG · 14.3<\u002Fspan><code class=\"inl\" style=\"font-size: 10px;\">/p<\u002Fcode> standalone receiver<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fdiv>\n\n      <h3 style=\"margin-top: 48px;\">Workpads for KaiOS · feature phones<\u002Fh3>\n      <p>Portrait screenshots at the native 240×320 resolution. The KaiOS build is the proof that the Standard works on resource-constrained hardware with D-pad-only navigation — no touch, no framework, no account.<\u002Fp>\n      <div class=\"figgrid phones\">\n        <figure style=\"margin: 0;\">\n          <div class=\"phoneframe\">\n            <div class=\"pscreen\">\n              <image-slot id=\"kaios-list\" placeholder=\"KaiOS list — records\"><\u002Fimage-slot>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <figcaption class=\"figcap\"><span class=\"seq\">FIG · 14.4<\u002Fspan>List screen — D-pad nav<\u002Ffigcaption>\n        <\u002Ffigure>\n        <figure style=\"margin: 0;\">\n          <div class=\"phoneframe\">\n            <div class=\"pscreen\">\n              <image-slot id=\"kaios-wizard\" placeholder=\"KaiOS wizard — PADS step\"><\u002Fimage-slot>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <figcaption class=\"figcap\"><span class=\"seq\">FIG · 14.5<\u002Fspan>Wizard — PADS step<\u002Ffigcaption>\n        <\u002Ffigure>\n        <figure style=\"margin: 0;\">\n          <div class=\"phoneframe\">\n            <div class=\"pscreen\">\n              <image-slot id=\"kaios-share\" placeholder=\"KaiOS share — QR code / SMS\"><\u002Fimage-slot>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <figcaption class=\"figcap\"><span class=\"seq\">FIG · 14.6<\u002Fspan>Share — QR / SMS<\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fdiv>\n\n      <div class=\"callout\">\n        <strong>Identical service layer<\u002Fstrong>\n        workpadskaios and workpadsdotme run the same JavaScript files at the service layer. The codec is inlined byte-for-byte from <code class=\"inl\">@workpads/codec<\u002Fcode>. A URL encoded by one app decodes correctly in the other. This is the load-bearing interop guarantee of the Standard.\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- §15 Conformance -->\n  <section id=\"s15\">\n    <div class=\"sechead\">\n      <div class=\"num\">§ 15<\u002Fdiv>\n      <div>\n        <h2>Conformance &amp; use.<\u002Fh2>\n        <div class=\"sub\">What you may do with this standard, and what is asked in return.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"body\">\n      <p>The Workpads Standard is open. You may implement it, extend it, and build proprietary or open-source products on it without permission from Babb.<\u002Fp>\n\n      <h3>If your product generates workpad URLs<\u002Fh3>\n      <p>Encode according to §5 so any conformant decoder can read the record. Use the canonical scheme tag (<code class=\"inl\">1bg/<\u002Fcode>). Set the chain reference if linking related records. Do not invent new top-level fields; use the reserved bits (13–15) and register the assignment via BASICS.<\u002Fp>\n\n      <h3>If your product decodes workpad URLs<\u002Fh3>\n      <p>Implement §5 faithfully so records from any conformant encoder are readable. Accept the codebook-a (<code class=\"inl\">1ag/<\u002Fcode>) legacy format. Reject corrupted frames cleanly rather than rendering partial records. Walk the template fallback chain — never let the render fail visibly to the user.<\u002Fp>\n\n      <h3>If your product extends the format<\u002Fh3>\n      <p>Use the reserved field slots, reserved template bytes, or register a deviation via BASICS. The reserved bits are not first-come-first-served — coordinate with Babb before claiming them. The financial block (bit 12) is already specified for v0.2; new structured blocks should follow the same pattern.<\u002Fp>\n\n      <p class=\"pull\">Interoperability is the standard's core value — not exclusivity.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- §16 Versioning -->\n  <section id=\"s16\">\n    <div class=\"sechead\">\n      <div class=\"num\">§ 16<\u002Fdiv>\n      <div>\n        <h2>Versioning &amp; v0.2 roadmap.<\u002Fh2>\n        <div class=\"sub\">What's settled in design, pending implementation.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"body\">\n      <p>Section versions use <code class=\"inl\">v1<\u002Fcode>, <code class=\"inl\">v2<\u002Fcode>, etc. A section version increments on breaking changes — a field removed, an encoding slot reassigned. Additive changes (new optional fields, new sections) do not increment existing section versions. The overall standard version (<code class=\"inl\">v0.1<\u002Fcode>) tracks the implementation generation.<\u002Fp>\n\n      <h3>v0.2 roadmap<\u002Fh3>\n      <ul>\n        <li>Financial block in codec — amounts, currency, tax, compound invoicing (codebook b ships now; full implementation v0.2)<\u002Fli>\n        <li>Chain protocol — linked records, ACK, multi-worker chains<\u002Fli>\n        <li>Participants block — replaces the simple <code class=\"inl\">worker<\u002Fcode> text field with a typed party list<\u002Fli>\n        <li>KaiOS 2.5 build target<\u002Fli>\n        <li>URL scheme tag alignment across all implementations<\u002Fli>\n        <li>Block Registry v0.2 schema — typed customers and locations with a flag field<\u002Fli>\n        <li>Template Phase 2 — in-app browser scanner, consent banner UI<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- §17 workpads.me -->\n  <section id=\"s17\">\n    <div class=\"sechead\">\n      <div class=\"num\">§ 17<\u002Fdiv>\n      <div>\n        <h2>workpads.me.<\u002Fh2>\n        <div class=\"sub\">The canonical web entry point.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"body\">\n      <p><code class=\"inl\">workpads.me<\u002Fcode> is the canonical browser host for share URLs. It serves three roles. As an <strong>orchestrator<\u002Fstrong>, the <code class=\"inl\">/p<\u002Fcode> and <code class=\"inl\">/n<\u002Fcode> routes decode incoming URLs and render the record or note with no install required. As an <strong>app<\u002Fstrong>, the root route is a full Workpads application — wizard, list, panels, personal store. As a <strong>template host<\u002Fstrong>, <code class=\"inl\">registry.workpads.me<\u002Fcode> hosts paid-tier templates with URI permanence, trust elevation, render analytics, and gallery discovery.<\u002Fp>\n\n      <p>The orchestrator pages never change. They have no state, no user accounts, no database. Their entire behaviour is determined by what is in the URL fragment. They can be hosted on any static hosting provider, cached at CDN edges globally, and served essentially for free at any scale.<\u002Fp>\n\n      <pre class=\"code\">https://workpads.me/             <span class=\"c\">→ full app (wizard, list, panels)<\u002Fspan>\nhttps://workpads.me/p#1bg/…      <span class=\"c\">→ record receiver (orchestrator)<\u002Fspan>\nhttps://workpads.me/n#n1/…       <span class=\"c\">→ note receiver (orchestrator)<\u002Fspan>\nhttps://registry.workpads.me/    <span class=\"c\">→ paid-tier template host<\u002Fspan><\u002Fpre>\n\n      <figure style=\"margin: 28px 0 8px;\">\n        <div class=\"browserframe\">\n          <div class=\"bbar\">\n            <span class=\"bdot\"><\u002Fspan><span class=\"bdot\"><\u002Fspan><span class=\"bdot\"><\u002Fspan>\n            <span class=\"burl\">workpads.me/n#n1/eJyNk1ZJ…<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"bbody\">\n            <image-slot id=\"wpdotme-note-render\" placeholder=\"A note share rendered through a Schema-P template — full presentation, offline, from a URL\"><\u002Fimage-slot>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <figcaption class=\"figcap\"><span class=\"seq\">FIG · 17.1<\u002Fspan>Note share rendered through a Schema-P template — entirely client-side<\u002Ffigcaption>\n      <\u002Ffigure>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- §18 Open door -->\n  <section id=\"s18\">\n    <div class=\"sechead\">\n      <div class=\"num\">§ 18<\u002Fdiv>\n      <div>\n        <h2>An open door, not a protected territory.<\u002Fh2>\n        <div class=\"sub\">Why this is a standard and not a product.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"body\">\n      <p>Babb created the Workpads Standard to grow a format that serves workers, not to own a market. Babb builds reference implementations — KaiOS, web, CLI — to prove the standard works in practice and to establish a baseline for conformance testing. These are not the only valid implementations. They are proofs of concept with a conformance record.<\u002Fp>\n\n      <p>The standard is designed to be implemented by anyone, for any purpose. Experimental apps, open-source tools, proprietary products, and platform-specific derivatives are all welcome. The standard defines what a workpad record is and how it is encoded; what you build with that is yours.<\u002Fp>\n\n      <p>What Babb asks in return is simple: if your product generates or decodes workpad URLs (<code class=\"inl\">workpads.me/p#1bg/…<\u002Fcode>), it should decode correctly the records it receives, and encode records that any conformant decoder can read. Interoperability is the standard's core value — not exclusivity.<\u002Fp>\n\n      <p>The standard grows through real implementation experience. Deviations found in practice feed the next version. Every conformant product makes the ecosystem stronger.<\u002Fp>\n\n      <div class=\"stamp\">END OF DRAFT · WP-DRAFT-01 · v0.1 · 2026-05-13<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<footer>\n  <div class=\"wrap\">\n    <div>\n      <h5>Workpads Standard<\u002Fh5>\n      <p style=\"color: var(--muted); margin: 0 0 8px; max-width: 56ch;\">A record format and protocol for portable, sovereign, URL-transmissible commercial records. Maintained by Babb. Open standard. BASICS Core conformance.<\u002Fp>\n      <p style=\"color: var(--muted-2); font-size: 11px; margin: 0;\">babb.tel · workpads.me · workpads-standard@master<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <h5>Specification<\u002Fh5>\n      <ul>\n        <li><a href=\"#s2\">§2 PADS Data Model<\u002Fa><\u002Fli>\n        <li><a href=\"#s3\">§3 URL-as-Document<\u002Fa><\u002Fli>\n        <li><a href=\"#s4\">§4 Template System<\u002Fa><\u002Fli>\n        <li><a href=\"#s5\">§5 Codec<\u002Fa><\u002Fli>\n        <li><a href=\"#s11\">§11 Chain Protocol<\u002Fa><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div>\n      <h5>Implementations<\u002Fh5>\n      <ul>\n        <li><a href=\"#s14\">workpadskaios<\u002Fa><\u002Fli>\n        <li><a href=\"#s14\">workpadsdotme<\u002Fa><\u002Fli>\n        <li><a href=\"#s13\">workpads-codec<\u002Fa><\u002Fli>\n        <li><a href=\"#s13\">workpads-cli<\u002Fa><\u002Fli>\n        <li><a href=\"#s13\">workpadsdev-cli<\u002Fa><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"stamp\" style=\"max-width: 960px; margin: 36px auto 0; padding: 18px 40px 0;\">BABB · OPEN STANDARD · v0.1 · 2026<\u002Fdiv>\n<\u002Ffooter>\n\n\n\n<\u002Fbody><\u002Fhtml>"
