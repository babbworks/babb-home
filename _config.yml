title: BABB
email: hello@babb.tel
description: >-
  Tools for the frontier.
baseurl: ""
url: "https://www.babb.tel"
twitter_username: babbworks
github_username:  babbworks
instagram_username: babbworks
facebook_username: babbworks
youtube_username: babbworks

# Build settings
plugins:
  - jekyll-feed
  - jekyll-paginate

# Collections
collections:
  places:
    output: true
    permalink: /places/:name/
  people:
    output: true
    permalink: /people/:name/

paginate: 20
paginate_path: "/page:num/"

exclude:
  # design deliverables and imported source files — reference only
  - babb-site-deliverable/
  - babb-place-deliverable/
  - imported-pages/
  # planning docs
  - TRANSITION-PLAN.md
  - TELEMETRY-SHORTCUT.md
  # old homepage (replaced by layout: home)
  - newindex.html
  # old pages/ subdirectories — pre-transition content, not yet migrated
  - pages/Company/
  - pages/Geographies/
  - pages/Protocols/
  - pages/Releases/
  - pages/Specs/
  - pages/Standards/
  - pages/Tests/
  - pages/Tools/
  # mini-site static assets — excluded from Jekyll processing
  - clark-report/README.md
  - clark-report/CNAME
  - bitpadsdotorg/README.md
  - bitpadsdotorg/CNAME
  # old posts — not yet migrated to new dispatch format
 
